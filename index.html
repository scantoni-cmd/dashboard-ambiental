<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso restringido</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1f8;color:#1f2547;font:14px/1.5 Poppins,"Segoe UI",system-ui,sans-serif;padding:16px}
.c{width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:0 12px 32px rgba(108,120,176,.16);padding:32px 28px}
.lg{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#7b5cf6,#2ed3f0);font-size:1.5rem;margin-bottom:16px}
h1{font-size:1.3rem;margin:0 0 4px;font-weight:600}
.m{color:#8b91ad;margin:0 0 8px}
label{display:block;font-weight:500;margin:14px 0 6px}
.f{position:relative}
input{width:100%;font:inherit;padding:.7rem 1rem;border:1px solid #e6e9f4;border-radius:12px;background:#f6f7fc;color:inherit}
#p{padding-right:5rem}
#ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:#6c4cf1;font:inherit;font-size:.8rem;cursor:pointer;padding:.4rem .6rem}
.go{width:100%;margin-top:20px;font:inherit;font-weight:500;padding:.75rem;border:0;border-radius:12px;background:linear-gradient(135deg,#7b5cf6,#5b3ee8);color:#fff;cursor:pointer;box-shadow:0 8px 18px rgba(108,76,241,.35)}
.go:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #6c4cf1;outline-offset:2px}
#e{min-height:1.4em;margin:14px 0 0;color:#d64545;font-size:.9rem}
.n{margin-top:14px;font-size:.78rem;color:#8b91ad}
</style>
</head>
<body>
<main class="c">
  <div class="lg" aria-hidden="true">🔒</div>
  <h1>Acceso restringido</h1>
  <p class="m">Tablero ambiental. Solo para personal autorizado de la ESE.</p>
  <form id="f" autocomplete="on">
    <label for="u">Usuario</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Contraseña</label>
    <div class="f">
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button id="ver" type="button" aria-pressed="false">Mostrar</button>
    </div>
    <button id="go" class="go" type="submit">Ingresar</button>
    <p id="e" role="alert"></p>
  </form>
  <p class="n">Si no tienes credenciales, solicítalas al administrador del tablero. Tras 5 intentos fallidos el acceso se bloquea temporalmente.</p>
</main>

const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const de64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const a64 = a => btoa(String.fromCharCode(...a));

async function derivar(u, p, salt) {
  const m = await crypto.subtle.importKey("raw", enc.encode(u.trim().toLowerCase() + "\u0000" + p), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: IT }, m, 256));
}
async function abrir(raw) {
  const d = de64(P);
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: d.slice(16, 28) }, k, d.slice(28)));
}

/* Muestra el tablero y agrega cierre de sesión e inactividad (15 min) */
function entrar(html) {
  const extra = '<script>(function(){var t,L=15*60*1000;function s(){sessionStorage.removeItem("k");location.reload()}function r(){clearTimeout(t);t=setTimeout(s,L)}["click","keydown","mousemove","touchstart","scroll"].forEach(function(e){addEventListener(e,r,{passive:true})});r();var b=document.createElement("button");b.textContent="Cerrar sesión";b.style.cssText="position:fixed;right:16px;bottom:16px;z-index:3000;padding:.55rem 1rem;border:0;border-radius:12px;background:#1f2547;color:#fff;font:500 13px Poppins,sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(31,37,71,.3)";b.onclick=s;document.body.appendChild(b)})()<\/script>';
  const i = html.lastIndexOf("</body>");
  document.open();
  document.write(i < 0 ? html + extra : html.slice(0, i) + extra + html.slice(i));
  document.close();
}

/* Bloqueo temporal tras intentos fallidos */
const LK = "acc_bloq";
const leer = () => { try { return JSON.parse(localStorage.getItem(LK) || "{}"); } catch (e) { return {}; } };
const poner = o => { try { localStorage.setItem(LK, JSON.stringify(o)); } catch (e) {} };
const faltan = () => { const s = leer(); return s.hasta && s.hasta > Date.now() ? Math.ceil((s.hasta - Date.now()) / 1000) : 0; };
let reloj;
function avisarBloqueo() {
  clearInterval(reloj);
  const t = () => {
    const f = faltan();
    if (!f) { clearInterval(reloj); $("e").textContent = ""; $("go").disabled = false; return; }
    $("go").disabled = true;
    $("e").textContent = `Demasiados intentos. Intenta de nuevo en ${f >= 60 ? Math.ceil(f / 60) + " min" : f + " s"}.`;
  };
  t(); reloj = setInterval(t, 1000);
}

$("ver").addEventListener("click", () => {
  const o = $("p").type === "password";
  $("p").type = o ? "text" : "password";
  $("ver").textContent = o ? "Ocultar" : "Mostrar";
  $("ver").setAttribute("aria-pressed", o);
});

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  if (faltan()) { avisarBloqueo(); return; }
  if (!window.crypto || !crypto.subtle) { $("e").textContent = "Este navegador no permite el acceso seguro. Abre la página por https:// con un navegador actualizado."; return; }
  $("go").disabled = true; $("e").textContent = "Verificando…";
  try {
    const raw = await derivar($("u").value, $("p").value, de64(P).slice(0, 16));
    const html = await abrir(raw);
    poner({});
    try { sessionStorage.setItem("k", a64(raw)); } catch (err) {}
    entrar(html);
  } catch (err) {
    const s = leer(), n = (s.n || 0) + 1;
    const o = { n };
    if (n % 5 === 0) o.hasta = Date.now() + Math.min(60000 * Math.pow(2, n / 5 - 1), 1800000);
    poner(o);
    $("p").value = "";
    if (faltan()) avisarBloqueo();
    else { $("e").textContent = "Usuario o contraseña incorrectos."; $("go").disabled = false; }
  }
});

(async () => {
